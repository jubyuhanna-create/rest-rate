<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="google" content="notranslate">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Restaurant Feedback</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@300;400;500;600&family=Noto+Sans+Arabic:wght@300;400;500;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <canvas id="confetti-canvas"></canvas>

  <!-- Language Switcher -->
  <div class="lang-bar">
    <button class="lang-btn active" data-lang="he">עב</button>
    <button class="lang-btn" data-lang="ar">ع</button>
    <button class="lang-btn" data-lang="en">EN</button>
  </div>

  <!-- SCREEN 1: Rating -->
  <div class="screen active" id="screen-rating">
    <div class="screen-inner">
      <div class="logo-mark">✦</div>
      <h1 class="main-question" data-i18n="question"></h1>
      <p class="sub-hint" data-i18n="tap_hint"></p>
      <div class="stars-row" id="stars-row" role="group" aria-label="Rating">
        <button class="star" data-val="1" aria-label="1 star">★</button>
        <button class="star" data-val="2" aria-label="2 stars">★</button>
        <button class="star" data-val="3" aria-label="3 stars">★</button>
        <button class="star" data-val="4" aria-label="4 stars">★</button>
        <button class="star" data-val="5" aria-label="5 stars">★</button>
      </div>
    </div>
  </div>

  <!-- SCREEN 2: Feedback — same options for every rating -->
  <div class="screen" id="screen-feedback">
    <div class="screen-inner">
      <div class="rating-block">
        <div class="emoji-display" id="fb-emoji">🙌</div>
        <h2 class="feedback-title" id="fb-title"></h2>

        <!-- Quick tags: tap to add to the text -->
        <div class="chips" id="chips"></div>

        <textarea id="comment" class="note-input note-input--prominent" rows="4"></textarea>

        <div class="btn-stack">
          <button class="btn btn-google" id="google-btn">
            <span data-i18n="google_btn"></span>
          </button>
          <button class="btn btn-outline" id="private-btn">
            <span data-i18n="private_btn"></span>
          </button>
        </div>

        <p class="privacy-note" data-i18n="privacy"></p>
      </div>
    </div>
  </div>

  <!-- SCREEN 3: Thank You -->
  <div class="screen" id="screen-thanks">
    <div class="screen-inner">
      <div class="thanks-icon">🙌</div>
      <h2 class="thanks-title" data-i18n="thanks_title"></h2>
      <p class="thanks-sub" data-i18n="thanks_sub"></p>

      <!-- Shown only after choosing Google -->
      <p id="thanks-copy-msg" class="thanks-copy-msg" style="display:none;"></p>
      <button id="thanks-google-btn" class="btn btn-google-gold" style="display:none;">
        <span data-i18n="google_paste_btn"></span>
      </button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
